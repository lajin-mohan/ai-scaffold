# CI Workflow - validates the ai-scaffold CLI package.

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  cli-checks:
    name: CLI package checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Release readiness
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git fetch origin main dev "${{ github.head_ref }}"
          npm run release:check -- --main origin/main --candidate "origin/${{ github.head_ref }}" --head-branch "${{ github.head_ref }}"

      # Deterministic version-drift guard (post-mortem 2026-08-12: a manual
      # release/* -> main PR left main at a newer package.json version than
      # dev for 9 days, unnoticed, with the release never tagged/published).
      # The fast-forward Release Action makes this structurally impossible in
      # the normal flow, but this catches it immediately if anything ever
      # pushes to main out-of-band again, instead of relying on someone
      # noticing by chance. See branching-rules.md "Merge Flow".
      - name: Branch version drift check
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git fetch origin dev
          MAIN_VERSION="$(node -p "require('./package.json').version")"
          DEV_VERSION="$(git show origin/dev:package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
          if [ "$MAIN_VERSION" != "$DEV_VERSION" ]; then
            echo "::error::main is at v$MAIN_VERSION but dev is at v$DEV_VERSION — they must always match."
            echo "::error::See .claude/rules/branching-rules.md 'Merge Flow' — release/* -> dev sync-back is required, or use the main -> dev recovery path."
            exit 1
          fi
          echo "OK: main and dev both at v$MAIN_VERSION."

      # This scaffold's entire enforcement layer is shell (hooks + smoke +
      # install scripts) and had zero static analysis until 2026-08-13.
      # -S warning matches the level the tree was cleaned to; errors and
      # warnings both fail. Templates are included: they ship to users.
      - name: Shellcheck
        run: |
          shellcheck --version
          find . -name "*.sh" -not -path "./node_modules/*" -print0 \
            | xargs -0 shellcheck -S warning

      - name: Pre-publish smoke
        run: bash scripts/pre-publish-smoke.sh

      - name: Verify npm pack
        run: npm_config_cache=/tmp/ai-scaffold-npm-cache npm pack --dry-run --json

  # Item 65b: generate a project from the PACKED artifact and run the commands
  # its own manifest declares. Presence assertions cannot catch a typo'd
  # dependency, a CVE-blocked version, or an install that refuses to run —
  # laravel and python both shipped broken through a fully green 113-gate suite.
  # Separate job so a toolchain-setup failure is never reported as a
  # golden-path failure.
  golden-path:
    name: Golden-path execution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install dependencies
        run: npm ci

      - name: Run golden path (all profiles, from the packed tarball)
        run: node scripts/golden-path.js

  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [cli-checks, golden-path]
    if: always()

    steps:
      - name: Determine result
        run: |
          if [ "${{ needs.cli-checks.result }}" != "success" ]; then
            echo "FAILED - CLI package checks did not pass."
            exit 1
          fi
          if [ "${{ needs.golden-path.result }}" != "success" ]; then
            echo "FAILED - golden-path execution did not pass."
            exit 1
          fi
          echo "All required CI jobs passed."
