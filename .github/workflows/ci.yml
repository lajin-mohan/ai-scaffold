# CI Workflow - validates the ai-scaffold CLI package.

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  cli-checks:
    name: CLI package checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Pre-publish smoke
        run: bash scripts/pre-publish-smoke.sh

      - name: Verify npm pack
        run: npm_config_cache=/tmp/ai-scaffold-npm-cache npm pack --dry-run --json

  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [cli-checks]
    if: always()

    steps:
      - name: Determine result
        run: |
          if [ "${{ needs.cli-checks.result }}" != "success" ]; then
            echo "FAILED - CLI package checks did not pass."
            exit 1
          fi
          echo "All required CI jobs passed."
