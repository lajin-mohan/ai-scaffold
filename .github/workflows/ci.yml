# CI Workflow — runs lint, typecheck, tests, audit, build
# Stack: Node.js + TypeScript + ReactJS + PHP + PostgreSQL (declared in CLAUDE.md)
#
# Jobs are gated: a failing earlier job blocks later ones. The full chain
# must pass before a PR can merge to dev or main per branching-rules.md.
#
# This workflow assumes a monorepo layout:
#   apps/api      — backend (Node/TS or PHP)
#   apps/web      — React frontend
#   packages/*    — shared packages (domain, shared, services, repositories)
#
# Adjust the matrix and commands when /bootstrap fills in the concrete
# stack values. Anything below referencing both Node and PHP runs the
# Node block by default — uncomment the PHP block if your backend is PHP.

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch: {}

# Cancel superseded runs on the same ref to save CI minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PHP_VERSION: "8.3"
  POSTGRES_VERSION: "16-alpine"

jobs:

  # ─────────────────────────────────────────────────────────────
  # Lint + typecheck — fast feedback, runs first
  # ─────────────────────────────────────────────────────────────
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      # Uncomment for PHP backend
      # - name: Setup PHP
      #   uses: shivammathur/setup-php@v2
      #   with:
      #     php-version: ${{ env.PHP_VERSION }}
      #     coverage: none
      #     tools: composer:v2, php-cs-fixer, phpstan
      # - run: composer install --no-interaction --prefer-dist
      # - run: vendor/bin/php-cs-fixer fix --dry-run --diff
      # - run: vendor/bin/phpstan analyse

  # ─────────────────────────────────────────────────────────────
  # Unit tests — pure, fast, no I/O
  # ─────────────────────────────────────────────────────────────
  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:unit

      # Uncomment for PHP backend
      # - uses: shivammathur/setup-php@v2
      #   with:
      #     php-version: ${{ env.PHP_VERSION }}
      #     coverage: xdebug
      # - run: composer install --no-interaction --prefer-dist
      # - run: vendor/bin/phpunit --testsuite=unit

  # ─────────────────────────────────────────────────────────────
  # Integration tests — real Postgres in service container
  # ─────────────────────────────────────────────────────────────
  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:${{ env.POSTGRES_VERSION }}
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://test:test@localhost:5432/test
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Run database migrations
        run: npm run db:migrate

      - name: Run integration tests
        run: npm run test:integration

      # Uncomment for PHP backend
      # - uses: shivammathur/setup-php@v2
      #   with:
      #     php-version: ${{ env.PHP_VERSION }}
      # - run: composer install --no-interaction --prefer-dist
      # - run: php artisan migrate --force
      #   env:
      #     DB_CONNECTION: pgsql
      #     DB_HOST: localhost
      #     DB_PORT: 5432
      #     DB_DATABASE: test
      #     DB_USERNAME: test
      #     DB_PASSWORD: test
      # - run: vendor/bin/phpunit --testsuite=integration

  # ─────────────────────────────────────────────────────────────
  # Build — verifies the production build succeeds
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: |
            apps/api/dist/
            apps/web/dist/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Dependency audit — fail on HIGH or CRITICAL CVEs
  # ─────────────────────────────────────────────────────────────
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: npm audit (high+)
        run: npm audit --audit-level=high

      # Uncomment for PHP backend
      # - uses: shivammathur/setup-php@v2
      #   with:
      #     php-version: ${{ env.PHP_VERSION }}
      # - run: composer install --no-interaction --prefer-dist
      # - run: composer audit --abandoned=fail

  # ─────────────────────────────────────────────────────────────
  # Coverage gate — drops below baseline = fail
  # ─────────────────────────────────────────────────────────────
  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration]
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:${{ env.POSTGRES_VERSION }}
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s

    env:
      DATABASE_URL: postgres://test:test@localhost:5432/test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          retention-days: 14

      # Add Codecov / Coveralls upload here if used:
      # - uses: codecov/codecov-action@v4

  # ─────────────────────────────────────────────────────────────
  # Final gate — all required jobs must pass
  # Branch protection rule on dev / main should require this job.
  # ─────────────────────────────────────────────────────────────
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [lint, test-unit, test-integration, build, audit, coverage]
    if: always()
    steps:
      - name: Verify all required jobs succeeded
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] \
            || [[ "${{ needs.test-unit.result }}" != "success" ]] \
            || [[ "${{ needs.test-integration.result }}" != "success" ]] \
            || [[ "${{ needs.build.result }}" != "success" ]] \
            || [[ "${{ needs.audit.result }}" != "success" ]] \
            || [[ "${{ needs.coverage.result }}" != "success" ]]; then
            echo "::error::One or more required CI jobs failed."
            exit 1
          fi
          echo "All required CI jobs passed."
