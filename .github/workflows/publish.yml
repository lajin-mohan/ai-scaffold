# Publish workflow - publishes to npm on v* tags.
#
# Uses npm trusted publishing. The npm package must be configured to trust this
# GitHub repository and workflow.

name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: |
          npm run lint
          npm run typecheck
          npm test
          bash scripts/pre-publish-smoke.sh

      - name: Verify package version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Verify tag matches package.json version
        run: |
          PACKAGE_VERSION="${{ steps.version.outputs.version }}"
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: package.json version ($PACKAGE_VERSION) doesn't match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Verify tag commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Error: release tag commit is not contained in main"
            exit 1
          fi

      - name: Verify package contents
        run: npm_config_cache=/tmp/ai-scaffold-npm-cache npm pack --dry-run --json

      - name: Publish to npm
        run: npm publish --provenance --access public
