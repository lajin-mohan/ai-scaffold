[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "{{PROJECT_NAME}}"
version = "0.1.0"
description = "{{PROJECT_DESCRIPTION}}"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "build"]

[tool.hatch.build.targets.wheel]
# This scaffold starter has no importable package directory (just a flat
# test_smoke.py at the root) — hatchling's default wheel file-selection
# requires one and hard-fails `pip install -e ".[dev]"` without it.
bypass-selection = true

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["."]
